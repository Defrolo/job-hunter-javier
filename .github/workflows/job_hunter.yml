name: Job Hunter Automation

on:
  schedule:
    # GitHub Actions usa hora UTC.
    # España peninsular (invierno UTC+1):
    # 08:30 CET = 07:30 UTC
    # 12:00 CET = 11:00 UTC
    # 15:30 CET = 14:30 UTC
    # 18:00 CET = 17:00 UTC
    - cron: '30 7 * * 1-5'
    - cron: '0 11 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '0 17 * * 1-5'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  hunt-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar búsqueda de empleo
        env:
          JOB_ALERT_EMAIL_USER: ${{ secrets.JOB_ALERT_EMAIL_USER }}
          JOB_ALERT_EMAIL_PASS: ${{ secrets.JOB_ALERT_EMAIL_PASS }}
          FORCE_RUN: "true"
        run: |
          python bot_job_hunter.py
